name: smoke

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  support-copilot-smoke:
    name: support copilot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline smoke
        run: make smoke

      - name: Run smoke tests
        run: python -m pytest tests/test_smoke_support_copilot.py -q
