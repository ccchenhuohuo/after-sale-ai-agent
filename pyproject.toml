[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulanzi-after-sell-copilot"
version = "0.1.0"
description = "ulanzi after-sell copilot MVP 运行时。"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "openai>=2.38,<3",
  "openai-agents>=0.17,<0.18",
  "arize-phoenix-otel>=0.16.0",
  "openinference-instrumentation-openai-agents",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "cryptography>=42.0",
  "fastapi>=0.110",
  "lark-oapi>=1.6.8",
  "uvicorn>=0.30",
]

[project.scripts]
chatcopilot = "agent_mvp:cli"
feishu-long-connection = "agent_runtime.feishu.long_connection:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["agent_mvp"]
